name: Rate snapshot baseline interfaces
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rate-snapshot-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned selected Boost headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libboost1.83-dev=1.83.0-2.1ubuntu3
          dpkg-query -W libboost1.83-dev
      - name: Verify the compiler's selected Boost header version
        run: |
          python3 - <<'PYTHON'
          import subprocess
          macros = subprocess.check_output(
              ["c++", "-dM", "-E", "-x", "c++", "-include", "boost/version.hpp", "/dev/null"],
              text=True,
          )
          expected = "#define BOOST_VERSION 108300"
          if expected not in macros.splitlines():
              raise SystemExit("Compiler did not select pinned Boost 1.83.0 headers")
          print(expected)
          PYTHON
      - name: Configure with pinned Boost configs and explicit GoogleTest fetch
        run: >-
          cmake --preset rate-snapshot-debug -DSUBATHON_FETCH_GOOGLETEST=ON
          -DBoost_DIR=/usr/lib/x86_64-linux-gnu/cmake/Boost-1.83.0
          -Dboost_headers_DIR=/usr/lib/x86_64-linux-gnu/cmake/boost_headers-1.83.0
      - name: Build inert rate interfaces and existing exact numeric suite
        run: cmake --build --preset rate-snapshot-debug
      - name: Run existing exact numeric and infrastructure checks only
        run: ctest --preset rate-snapshot-debug --verbose
