name: Repository schema validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-validation:
    name: schema-validation (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            python_minor: '3.10'
          - runner: ubuntu-24.04
            python_minor: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record selected host tools and verify distribution Python
        run: |
          uname -a
          cmake --version
          ctest --version
          ninja --version
          /usr/bin/python3 - <<'PYTHON'
          import sys
          expected = tuple(map(int, '${{ matrix.python_minor }}'.split('.')))
          if sys.version_info[:2] != expected:
              raise SystemExit('Runner did not select the admitted Python minor')
          print(sys.version)
          PYTHON
      - name: Install the unchanged isolated hash-locked validators
        run: |
          schema_validation_env="$RUNNER_TEMP/schema-validation-venv"
          /usr/bin/python3 -m venv "$schema_validation_env"
          "$schema_validation_env/bin/python" -I -m pip --isolated --disable-pip-version-check --no-cache-dir install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --requirement tools/schema_validation/requirements.lock
          if "$schema_validation_env/bin/python" -I -c 'import importlib.metadata, sys; sys.exit(not any(d.metadata["Name"].lower() == "setuptools" for d in importlib.metadata.distributions()))'; then
            "$schema_validation_env/bin/python" -I -m pip --isolated --disable-pip-version-check --no-cache-dir uninstall --yes setuptools
          fi
          "$schema_validation_env/bin/python" -I -m pip --isolated --disable-pip-version-check --no-cache-dir check
      - name: Configure the Python schema and example checks
        run: >-
          cmake --preset schema-validation-debug
          -DPython3_EXECUTABLE="$RUNNER_TEMP/schema-validation-venv/bin/python"
      - name: Build ordinary infrastructure
        run: cmake --build --preset schema-validation-debug
      - name: Validate every actual schema and positive/negative example
        run: ctest --preset schema-validation-debug -L '^schema-validation$' --no-tests=error --verbose
      - name: Check ordinary repository infrastructure
        run: ctest --preset schema-validation-debug -L '^scaffold$' --no-tests=error --verbose
