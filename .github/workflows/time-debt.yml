name: Time debt acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  time-debt-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure reviewed debt cases with selected GoogleTest source
        run: cmake --preset time-debt-debug -DSUBATHON_FETCH_GOOGLETEST=ON
      - name: Build debt proposals and reviewed cases
        run: cmake --build --preset time-debt-debug
      - name: Verify complete case registration
        run: |
          ctest --preset time-debt-debug -L time-debt --show-only
          ctest --preset time-debt-debug -L time-debt --show-only=json-v1 > "$RUNNER_TEMP/time-debt-tests.json"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "time-debt-tests.json").read_text())["tests"]
          if not tests:
              raise SystemExit("No time-debt cases registered")
          listing = subprocess.check_output([tests[0]["command"][0], "--gtest_list_tests"], text=True)
          expected, suite = set(), ""
          for line in listing.splitlines():
              name = line.split("#", 1)[0].strip()
              if not name:
                  continue
              if not line[0].isspace() and name.endswith("."):
                  suite = name
              elif line[0].isspace() and suite:
                  expected.add(suite + name)
          if not expected or {test["name"] for test in tests} != expected or len(tests) != len(expected):
              raise SystemExit("CTest registration does not match compiled debt cases")
          print(f"Discovered all {len(tests)} compiled time-debt cases")
          PYTHON
      - name: Run reviewed debt acceptance
        run: ctest --preset time-debt-debug -L time-debt
