name: Time debt acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  time-debt-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure reviewed debt cases with selected GoogleTest source
        run: cmake --preset time-debt-debug -DSUBATHON_FETCH_GOOGLETEST=ON
      - name: Build debt proposals and reviewed cases
        run: cmake --build --preset time-debt-debug
      - name: Verify enabled time-debt labels and native result semantics
        run: |
          python3 - <<'PYTHON'
          import json
          import subprocess
          discovery = json.loads(subprocess.check_output(
              ["ctest", "--preset", "time-debt-debug", "--show-only=json-v1"], text=True))
          selected = [test for test in discovery["tests"]
                      if "time-debt" in next((p["value"] for p in test["properties"] if p["name"] == "LABELS"), [])]
          if not selected:
              raise SystemExit("No enabled time-debt tests were discovered")
          for test in selected:
              props = {p["name"]: p["value"] for p in test["properties"]}
              if not {'time-debt', 'acceptance', 'core'}.issubset(props.get("LABELS", [])):
                  raise SystemExit("A time-debt test lost its required labels")
              if "intentional-red" in props.get("LABELS", []):
                  raise SystemExit("Implemented behavior was put in the red lane")
              if props.get("DISABLED") or props.get("WILL_FAIL"):
                  raise SystemExit("A time-debt test is disabled or failure-inverted")
              if props.get("SKIP_REGULAR_EXPRESSION", [r"\[  SKIPPED \]"]) != [r"\[  SKIPPED \]"]:
                  raise SystemExit("A time-debt test has custom skip matching")
              if any(key in props for key in ("SKIP_RETURN_CODE", "PASS_REGULAR_EXPRESSION", "FAIL_REGULAR_EXPRESSION")):
                  raise SystemExit("A time-debt test rewrites native results")
              if props.get("TIMEOUT") != 5:
                  raise SystemExit("A time-debt test timeout changed")
          PYTHON
      - name: Run reviewed debt acceptance
        run: ctest --preset time-debt-debug -L time-debt --no-tests=error
