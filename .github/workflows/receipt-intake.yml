name: Receipt intake simulation acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt-intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure with explicit pinned GoogleTest fetch
        run: cmake --preset receipt-intake-debug -DSUBATHON_FETCH_GOOGLETEST=ON
      - name: Build reviewed receipt service cases
        run: cmake --build --preset receipt-intake-debug
      - name: Run synthetic repository-port simulation
        run: ctest --preset receipt-intake-debug -L receipt-intake
