name: Time-credit acceptance and regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure with explicit pinned dependency fetch
        run: cmake --preset acceptance-debug -DSUBATHON_FETCH_GOOGLETEST=ON
      - name: Build real GoogleTest acceptance cases
        run: cmake --build --preset acceptance-debug
      - name: Run reviewed acceptance and regression cases
        run: ctest --preset acceptance-debug -L "acceptance|regression"
