name: Effective permissions baseline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  effective-permissions-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned selected Boost headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libboost1.83-dev=1.83.0-2.1ubuntu3
          dpkg-query -W libboost1.83-dev
      - name: Verify the compiler's selected Boost header version
        run: |
          python3 - <<'PYTHON'
          import subprocess
          macros = subprocess.check_output(
              ["c++", "-dM", "-E", "-x", "c++", "-include", "boost/version.hpp", "/dev/null"],
              text=True,
          )
          expected = "#define BOOST_VERSION 108300"
          if expected not in macros.splitlines():
              raise SystemExit("Compiler did not select pinned Boost 1.83.0 headers")
          print(expected)
          PYTHON
      - name: Configure with pinned Boost configs and explicit GoogleTest fetch
        run: >-
          cmake --preset effective-permissions-debug -DSUBATHON_FETCH_GOOGLETEST=ON
          -DBoost_DIR=/usr/lib/x86_64-linux-gnu/cmake/Boost-1.83.0
          -Dboost_headers_DIR=/usr/lib/x86_64-linux-gnu/cmake/boost_headers-1.83.0
      - name: Compile permission baseline and existing checks
        run: cmake --build --preset effective-permissions-debug
      - name: Require the exact enabled permission baseline inventory without running it
        run: |
          python3 - <<'PYTHON'
          import json
          import subprocess
          from pathlib import Path
          inventory = json.loads(Path("tests/fixtures/effective-permissions-v1.json").read_text())
          expected = {"effective-permissions." + case["name"] for case in inventory["cases"]}
          if not expected or len(expected) != len(inventory["cases"]):
              raise SystemExit("Empty or duplicated baseline inventory")
          discovery = json.loads(subprocess.check_output(
              ["ctest", "--preset", "effective-permissions-debug", "--show-only=json-v1"], text=True))
          found = [case for case in discovery["tests"]
                   if case["name"].startswith("effective-permissions.")]
          if len(found) != len(expected) or {case["name"] for case in found} != expected:
              raise SystemExit("Permission discovery differs from the reviewed case inventory")
          for case in found:
              props = {item["name"]: item["value"] for item in case["properties"]}
              if any(props.get(key, False) for key in ("DISABLED", "WILL_FAIL")):
                  raise SystemExit("Permission case is disabled or failure-inverted")
              # CMake's GoogleTest discovery supplies its standard skip-message detector.
              if props.get("SKIP_REGULAR_EXPRESSION", [r"\[  SKIPPED \]"]) != [r"\[  SKIPPED \]"]:
                  raise SystemExit("Permission case has a custom skip expression")
              if any(key in props for key in ("SKIP_RETURN_CODE", "PASS_REGULAR_EXPRESSION", "FAIL_REGULAR_EXPRESSION")):
                  raise SystemExit("Permission case has a custom result-rewriting property")
              if set(props.get("LABELS", [])) != {"effective-permissions", "acceptance", "core", "intentional-red"}:
                  raise SystemExit("Permission case has unexpected suite labels")
              if props.get("TIMEOUT") != 10:
                  raise SystemExit("Permission case has an unexpected timeout")
          print(f"Compiled and discovered {len(found)} enabled permission cases; no feature body invoked")
          PYTHON
      - name: Verify mandatory green environment discovery
        run: |
          python3 - <<'PYTHON'
          import json
          import subprocess
          discovery = json.loads(subprocess.check_output(
              ["ctest", "--preset", "effective-permissions-debug", "--show-only=json-v1"], text=True))
          found = [case for case in discovery["tests"]
                   if case["name"] == "scaffold.effective_permissions_environment"]
          if len(found) != 1:
              raise SystemExit("The independent selected-Boost environment must be discovered exactly once")
          props = {item["name"]: item["value"] for item in found[0]["properties"]}
          if props.get("DISABLED", False) or props.get("WILL_FAIL", False):
              raise SystemExit("The environment check is disabled or failure-inverted")
          labels = set(props.get("LABELS", []))
          if "effective-permissions-environment" not in labels or "intentional-red" in labels:
              raise SystemExit("The mandatory environment is not a separate green check")
          print("Independent green environment discovered; no feature body invoked")
          PYTHON
      - name: Require the independent selected-Boost environment
        run: |
          ulimit -c 0
          ctest --preset effective-permissions-debug -R '^scaffold.effective_permissions_environment$' --no-tests=error --verbose
      - name: Run existing numeric and infrastructure checks
        # New permission feature red remains a separately recorded explicit command.
        run: ctest --preset effective-permissions-debug -LE '^intentional-red$' -E '^scaffold.effective_permissions_environment$' --no-tests=error --verbose
