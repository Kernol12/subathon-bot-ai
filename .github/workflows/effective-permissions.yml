name: Effective permissions acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  effective-permissions-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned selected Boost headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libboost1.83-dev=1.83.0-2.1ubuntu3
          dpkg-query -W libboost1.83-dev
      - name: Verify the compiler's selected Boost header version
        run: |
          python3 - <<'PYTHON'
          import subprocess
          macros = subprocess.check_output(
              ["c++", "-dM", "-E", "-x", "c++", "-include", "boost/version.hpp", "/dev/null"],
              text=True,
          )
          expected = "#define BOOST_VERSION 108300"
          if expected not in macros.splitlines():
              raise SystemExit("Compiler did not select pinned Boost 1.83.0 headers")
          print(expected)
          PYTHON
      - name: Configure with pinned Boost configs and explicit GoogleTest fetch
        run: >-
          cmake --preset effective-permissions-debug -DSUBATHON_FETCH_GOOGLETEST=ON
          -DBoost_DIR=/usr/lib/x86_64-linux-gnu/cmake/Boost-1.83.0
          -Dboost_headers_DIR=/usr/lib/x86_64-linux-gnu/cmake/boost_headers-1.83.0
      - name: Compile permission acceptance and existing checks
        run: cmake --build --preset effective-permissions-debug
      - name: Verify independent permission fixture integrity
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          inventory = json.loads(Path("tests/fixtures/effective-permissions-v1.json").read_text())
          names = [case["name"] for case in inventory["cases"]]
          if not names or len(set(names)) != len(names):
              raise SystemExit("Empty or duplicated permission fixture names")
          PYTHON
      - name: Verify enabled effective-permissions labels and native result semantics
        run: |
          python3 - <<'PYTHON'
          import json
          import subprocess
          discovery = json.loads(subprocess.check_output(
              ["ctest", "--preset", "effective-permissions-debug", "--show-only=json-v1"], text=True))
          selected = [test for test in discovery["tests"]
                      if "effective-permissions" in next((p["value"] for p in test["properties"] if p["name"] == "LABELS"), [])]
          if not selected:
              raise SystemExit("No enabled effective-permissions tests were discovered")
          for test in selected:
              props = {p["name"]: p["value"] for p in test["properties"]}
              if not {'acceptance', 'effective-permissions', 'core'}.issubset(props.get("LABELS", [])):
                  raise SystemExit("A effective-permissions test lost its required labels")
              if props.get("DISABLED") or props.get("WILL_FAIL"):
                  raise SystemExit("A effective-permissions test is disabled or failure-inverted")
              if props.get("SKIP_REGULAR_EXPRESSION", [r"\[  SKIPPED \]"]) != [r"\[  SKIPPED \]"]:
                  raise SystemExit("A effective-permissions test has custom skip matching")
              if any(key in props for key in ("SKIP_RETURN_CODE", "PASS_REGULAR_EXPRESSION", "FAIL_REGULAR_EXPRESSION")):
                  raise SystemExit("A effective-permissions test rewrites native results")
              if props.get("TIMEOUT") != 10:
                  raise SystemExit("A effective-permissions test timeout changed")
          PYTHON
      - name: Run reviewed effective permission acceptance
        run: ctest --preset effective-permissions-debug -L '^effective-permissions$' --no-tests=error --verbose
      - name: Run existing numeric and infrastructure checks
        run: ctest --preset effective-permissions-debug -LE '^effective-permissions$' --no-tests=error --verbose
