name: Milestone progression acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  milestone-progression-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned selected Boost headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libboost1.83-dev=1.83.0-2.1ubuntu3
          dpkg-query -W libboost1.83-dev
      - name: Verify the compiler's selected Boost header version
        run: |
          python3 - <<'PYTHON'
          import subprocess
          macros = subprocess.check_output(
              ["c++", "-dM", "-E", "-x", "c++", "-include", "boost/version.hpp", "/dev/null"],
              text=True,
          )
          expected = "#define BOOST_VERSION 108300"
          if expected not in macros.splitlines():
              raise SystemExit("Compiler did not select pinned Boost 1.83.0 headers")
          print(expected)
          PYTHON
      - name: Configure with pinned Boost configs and explicit GoogleTest fetch
        run: >-
          cmake --preset milestone-progression-debug -DSUBATHON_FETCH_GOOGLETEST=ON
          -DBoost_DIR=/usr/lib/x86_64-linux-gnu/cmake/Boost-1.83.0
          -Dboost_headers_DIR=/usr/lib/x86_64-linux-gnu/cmake/boost_headers-1.83.0
      - name: Build reviewed milestone acceptance and existing checks
        run: cmake --build --preset milestone-progression-debug
      - name: Verify the independent milestone literal vectors
        run: |
          python3 - <<'PYTHON'
          import pathlib
          import re

          source = pathlib.Path("tests/acceptance/milestone_progression_tests.cpp").read_text()
          fixture = pathlib.Path("tests/fixtures/milestone_progression_vectors.hpp").read_text()
          rows = re.findall(r'\bRow\{"(\w+)"', fixture)
          parameterized = re.findall(r"\bTEST_P\(\s*(\w+)\s*,\s*(\w+)\s*\)", source)
          if len(rows) != 20 or len(set(rows)) != 20:
              raise SystemExit("The independent milestone fixture must retain its frozen 20 literal rows")
          if parameterized != [("MilestoneVectors", "MatchesIndependentLiteral")]:
              raise SystemExit("Parameterized feature boundary differs from the reviewed inventory")
          PYTHON
      - name: Verify enabled milestone-progression labels and native result semantics
        run: |
          python3 - <<'PYTHON'
          import json
          import subprocess
          discovery = json.loads(subprocess.check_output(
              ["ctest", "--preset", "milestone-progression-debug", "--show-only=json-v1"], text=True))
          selected = [test for test in discovery["tests"]
                      if "milestone-progression" in next((p["value"] for p in test["properties"] if p["name"] == "LABELS"), [])]
          if not selected:
              raise SystemExit("No enabled milestone-progression tests were discovered")
          for test in selected:
              props = {p["name"]: p["value"] for p in test["properties"]}
              if not {'acceptance', 'milestone-progression', 'core'}.issubset(props.get("LABELS", [])):
                  raise SystemExit("A milestone-progression test lost its required labels")
              if "intentional-red" in props.get("LABELS", []):
                  raise SystemExit("Implemented behavior was put in the red lane")
              if props.get("DISABLED") or props.get("WILL_FAIL"):
                  raise SystemExit("A milestone-progression test is disabled or failure-inverted")
              if props.get("SKIP_REGULAR_EXPRESSION", [r"\[  SKIPPED \]"]) != [r"\[  SKIPPED \]"]:
                  raise SystemExit("A milestone-progression test has custom skip matching")
              if any(key in props for key in ("SKIP_RETURN_CODE", "PASS_REGULAR_EXPRESSION", "FAIL_REGULAR_EXPRESSION")):
                  raise SystemExit("A milestone-progression test rewrites native results")
              if props.get("TIMEOUT") != 30:
                  raise SystemExit("A milestone-progression test timeout changed")
          PYTHON
      - name: Run existing numeric and infrastructure checks
        run: ctest --preset milestone-progression-debug -LE '^milestone-progression$' --no-tests=error --verbose
      - name: Run every reviewed milestone acceptance body unconditionally
        run: ctest --preset milestone-progression-debug -L '^milestone-progression$' --no-tests=error --verbose
