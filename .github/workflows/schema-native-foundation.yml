name: Schema native and public acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-native-foundation:
    name: schema-native-foundation (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            python_minor: '3.10'
          - runner: ubuntu-24.04
            python_minor: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record actual native host and toolchain
        run: |
          uname -a
          c++ --version
          cmake --version
          ctest --version
          ninja --version
          ldd --version
          /usr/bin/python3 - <<'PYTHON'
          import sys
          expected = tuple(map(int, '${{ matrix.python_minor }}'.split('.')))
          if sys.version_info[:2] != expected:
              raise SystemExit('Runner did not select the admitted Python minor')
          print(sys.version)
          PYTHON
      - name: Create the isolated hash-locked SDK environment
        run: |
          schema_validation_env="$RUNNER_TEMP/schema-validation-venv"
          /usr/bin/python3 -m venv "$schema_validation_env"
          "$schema_validation_env/bin/python" -I -m pip --isolated --disable-pip-version-check --no-cache-dir install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --requirement tools/schema_validation/requirements.lock
          if "$schema_validation_env/bin/python" -I -c 'import importlib.metadata, sys; sys.exit(not any(d.metadata["Name"].lower() == "setuptools" for d in importlib.metadata.distributions()))'; then
            "$schema_validation_env/bin/python" -I -m pip --isolated --disable-pip-version-check --no-cache-dir uninstall --yes setuptools
          fi
          "$schema_validation_env/bin/python" -I -m pip --isolated --disable-pip-version-check --no-cache-dir check
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LANG=C.UTF-8 "$schema_validation_env/bin/python" -I -S -B tools/schema_validation/check_baseline.py
      - name: Configure the reviewed common owner and real native facilities
        run: >-
          cmake --preset schema-transport-debug
          -DPython3_EXECUTABLE="$RUNNER_TEMP/schema-validation-venv/bin/python"
          -DSUBATHON_FETCH_GOOGLETEST=ON
      - name: Build the native foundation and versioned artifact
        run: cmake --build --preset schema-transport-debug --verbose
      - name: Record actual artifact identity and exports
        run: |
          sha256sum build/schema-transport-debug/lib/libsubathon_schema_transport_v1.so
          sha256sum tools/schema_validation/native/transport_v1.h tools/schema_validation/native/transport_entry.cpp tools/schema_validation/native/raw_ops_v1.h tools/schema_validation/native/transport_core_v1_impl.h tests/schema_validation/native_fault_ops.h
          sha256sum tests/schema_validation/native_foundation.cpp tests/schema_validation/native_foundation_child.cpp tests/schema_validation/native_foundation_child.h tests/schema_validation/native_loader_foundation.py
          nm -D --defined-only build/schema-transport-debug/lib/libsubathon_schema_transport_v1.so
      - name: Run reviewed static-audit controls without any native discovery
        run: >-
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LANG=C.UTF-8
          /usr/bin/python3 -I -S -B tests/schema_validation/native_audit_controls.py
      - name: Run literal static clone-entry and binding controls
        run: >-
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LANG=C.UTF-8
          /usr/bin/python3 -I -S -B tests/schema_validation/native_entry_controls.py
      - name: Run literal owner graph and inherited stack controls
        run: >-
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LANG=C.UTF-8
          /usr/bin/python3 -I -S -B tests/schema_validation/native_owner_audit_controls.py
      - name: Audit generated raw child functions before any native execution
        run: >-
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LANG=C.UTF-8
          /usr/bin/python3 -I -S -B tools/schema_validation/audit_native_foundation.py
          --foundation "$PWD/build/schema-transport-debug/tests/schema_validation/schema_transport_native_foundation"
          --child "$PWD/build/schema-transport-debug/tests/schema_validation/schema_transport_native_foundation_child"
          --transport "$PWD/build/schema-transport-debug/lib/libsubathon_schema_transport_v1.so"
      - name: Run literal fault-path static controls
        run: >-
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LANG=C.UTF-8
          /usr/bin/python3 -I -S -B tests/schema_validation/native_fault_audit_controls.py
      - name: Audit actual primitive entry and both new raw child graphs
        run: >-
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LANG=C.UTF-8
          /usr/bin/python3 -I -S -B tools/schema_validation/audit_native_fault_foundation.py
          --foundation "$PWD/build/schema-transport-debug/tests/schema_validation/schema_transport_native_foundation"
          --child "$PWD/build/schema-transport-debug/tests/schema_validation/schema_transport_native_fault_child"
          --fault "$PWD/build/schema-transport-debug/lib/libsubathon_schema_fault_v1.so"
      - name: Export actual clone entry and binding relocations for different review
        run: |
          /usr/bin/python3 - <<'PYTHON'
          from pathlib import Path
          import runpy
          import subprocess
          namespace = runpy.run_path('tools/schema_validation/audit_native_foundation.py', run_name='native_static_evidence')
          executable = Path('build/schema-transport-debug/tests/schema_validation/schema_transport_native_foundation').resolve(strict=True)
          functions = namespace['disassembly'](executable)
          probe_name = '(anonymous namespace)::probe(bool, (anonymous namespace)::Controller*)'
          probes = [item for item in functions.values() if item[1] == probe_name]
          if len(probes) != 1:
              raise SystemExit('Actual native probe symbol is missing/ambiguous')
          instructions = probes[0][2]
          calls = [index for index, item in enumerate(instructions) if item[1].startswith('call') and 'syscall@' in item[2]]
          if len(calls) != 1:
              raise SystemExit('Actual clone syscall edge needs separate extraction/review')
          print('ACTUAL CLONE RETURN EDGE; EVIDENCE ONLY, NO RUNTIME ADMISSION', flush=True)
          for address, mnemonic, operands in instructions[max(0, calls[0]-8):calls[0]+30]:
              print(f'{address:x}: {mnemonic} {operands}', flush=True)
          bindings = [item for item in functions.values() if 'SyscallBindingToActualLibc_Test::TestBody()' in item[1]]
          if len(bindings) != 1:
              raise SystemExit('Actual binding test symbol is missing/ambiguous')
          print('ACTUAL ADDRESS-TAKEN BINDING REFERENCES', flush=True)
          for address, mnemonic, operands in bindings[0][2]:
              if 'syscall@' in operands:
                  print(f'{address:x}: {mnemonic} {operands}', flush=True)
          print('ACTUAL SYSCALL PLT', flush=True)
          for _, name, instructions in functions.values():
              if name == 'syscall@plt':
                  print(name, instructions, flush=True)
          print('ACTUAL DYNAMIC SYMBOL RELOCATIONS', flush=True)
          subprocess.run(['readelf', '-Wr', str(executable)], check=True, timeout=30)
          print('Static stage complete; runtime requires the following exact bootstrap', flush=True)
          PYTHON
      - name: Verify actual libc binding without creating a child
        run: |
          /usr/bin/python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          import tempfile
          import xml.etree.ElementTree as ET
          executable = Path('build/schema-transport-debug/tests/schema_validation/schema_transport_native_foundation').resolve(strict=True)
          with tempfile.TemporaryDirectory(prefix='schema-native-binding-') as temporary:
              report = Path(temporary) / 'binding.xml'
              subprocess.run([
                  str(executable), '--gtest_filter=SchemaNativeFoundation.SyscallBindingToActualLibc',
                  '--gtest_color=no', '--gtest_output=xml:' + str(report),
              ], check=True, timeout=30, env={'PATH': '/usr/bin:/bin', 'LC_ALL': 'C.UTF-8', 'LANG': 'C.UTF-8'})
              root = ET.parse(report).getroot()
              cases = list(root.iter('testcase'))
              if (root.get('tests') != '1' or root.get('failures') != '0' or root.get('errors') != '0'
                      or root.get('disabled') != '0' or len(cases) != 1 or list(root.iter('skipped'))
                      or cases[0].get('name') != 'SyscallBindingToActualLibc'
                      or cases[0].get('classname') != 'SchemaNativeFoundation'
                      or cases[0].get('status') != 'run' or cases[0].get('result') != 'completed'):
                  raise SystemExit('Binding bootstrap did not execute exactly one passing case')
          print('One actual no-child libc binding case passed; kernel probes are separate')
          PYTHON
      - name: Require the exact enabled native foundation registrations
        run: |
          /usr/bin/python3 - <<'PYTHON'
          import ast
          import json
          from pathlib import Path
          import shutil
          import subprocess
          source = ast.parse(Path('tests/schema_validation/native_loader_foundation.py').read_text())
          classes = [item for item in source.body if isinstance(item, ast.ClassDef) and item.name == 'NativeLoaderFoundation']
          methods = [item for item in classes[0].body if isinstance(item, ast.FunctionDef) and item.name.startswith('test_')] if len(classes) == 1 else []
          if len(methods) != 2 or {item.name for item in methods} != {'test_builtin_abi_profile', 'test_actual_artifact_rejects_null_manifest_before_ownership'} or any(item.decorator_list for item in methods):
              raise SystemExit('Native loader methods changed or are disabled/inverted')
          expected = {
              'InvalidManifestRefusesBeforeOwnership',
              'SigchldProfileQueryWithoutBirth',
              'AtomicPidfdSignalsAndCloseRange',
              'ActualExecveNonvalidatingProbe',
              'ForeignThreadAndCompetingReapKeepPinnedIdentity',
              'ControlledCloneErrorsRollbackWithoutGuessingOutput',
              'SyscallBindingToActualLibc',
          }
          names = {'schema-native-foundation.SchemaNativeFoundation.' + name for name in expected}
          helper = {
              'FreshPlanOneShotAndExactSnapshotEncoding',
              'IdleArmInvalidManifestThenTerminalCancel',
              'Parent64RecordBoundaryPoisonsOnlyOn65th',
              'CallerCannotForgeControllerJournal',
              'Case28HasOneActualNonCloexecPrebirthSentinel',
              'CaptureTee257ThenOneRefusesWithoutOverflow',
              'TinyFdLimitRollbackRestoresCallerLimit',
              'SharedChildJournal32ThenOverflowIsVisible',
              'RealReadyChildAdvancesOnlyTheOffsetClock',
              'PostBirthResourceHookNeedsRealReadinessWithoutClassifying',
              'DeliberateControllerReapIsDistinctFromFallback',
              'ControllerConsumedNormal125PoisonsBeforeActionAck',
          }
          names.update('schema-native-foundation.NativeFaultFoundation.' + name for name in helper)
          for prefix, method, count in (
              ('ClosedTuples/NativeFaultInvalidPlan', 'RefusesFreshInvalidTupleWithoutPublishedState', 6),
              ('ClosedCapture/NativeFaultCapture', 'ActualPipeTeeSuffixAndEofAreRequired', 4),
              ('CloseEdges/NativeFaultSignal', 'ActualMainThreadSigintPreservesCallerState', 2),
              ('ClosedBytes/NativeFaultChildBytes', 'ActualFixedExecBytesAndStatus', 24),
          ):
              names.update('schema-native-foundation.' + prefix + '.' + method + '/' + str(index) for index in range(count))
          names.add('schema-native.loader-foundation')
          ctest = shutil.which('ctest')
          if ctest is None:
              raise SystemExit('Configured CTest tool is unavailable')
          ctest = str(Path(ctest).resolve(strict=True))
          print('Selected CTest tool:', ctest)
          data = json.loads(subprocess.check_output([
              ctest, '--preset', 'schema-transport-debug',
              '-L', '^schema-native-foundation$', '--show-only=json-v1',
          ], text=True, env={'PATH': '/usr/bin:/bin', 'LC_ALL': 'C.UTF-8', 'LANG': 'C.UTF-8'}))
          if {item['name'] for item in data['tests']} != names or len(data['tests']) != len(names):
              raise SystemExit('Native foundation registrations differ from the reviewed inventory')
          for item in data['tests']:
              properties = {entry['name']: entry['value'] for entry in item['properties']}
              if properties.get('DISABLED') or properties.get('WILL_FAIL'):
                  raise SystemExit('Native foundation is disabled or failure-inverted')
              if 'schema-native-foundation' not in properties.get('LABELS', []):
                  raise SystemExit('Native foundation label missing')
          print('Exact55 native cases and one two-method loader program registered and enabled')
          PYTHON
      - name: Execute every reviewed native foundation unconditionally
        run: |
          schema_ctest_path="$(command -v ctest)"
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LANG=C.UTF-8 \
            "$schema_ctest_path" --preset schema-transport-debug -L '^schema-native-foundation$' --no-tests=error --verbose
      - name: Require all closed native and public acceptance registrations
        run: |
          /usr/bin/python3 - <<'PYTHON'
          import ast
          import json
          from pathlib import Path
          import shutil
          import subprocess
          rows = {'a1', 'a2', 'a3', 'o4', 'o5', 'o6', 'o7', 'o8', 'o9', 'o10', 's11', 's12', 'e13', 'e14', 'e15', 'e16', 'e17', 'e18', 'e19', 'e20', 'e21', 'e22', 'd23', 'p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7', 'p8', 'w1', 'w2', 'w3', 'w4', 'w5', 'w6', 'w7', 'w8', 'w9', 'w10', 'w11', 'w12', 'w13', 'w14', 'w15', 'w16', 'w17', 'w18', 'c1', 'c2', 'c3', 'i25a', 'i25b', 'r26', 'l27', 'f28'}
          expected = {'schema-native.owner-' + row for row in rows}
          expected.add('schema-native.transport-acceptance')
          suites = {'native_binding_acceptance': 9, 'native_loader_cleanup_regression': 1,
                    'native_normalization_close_regression': 1,
                    'wrapper_acceptance': 64,
                    'parent_cleanup_regression': 2, 'worker_context_regression': 3,
                    'worker_lexical_regression': 3, 'parent_spawn_regression': 2}
          expected.update('schema-native.' + name for name in suites)
          for name, count in suites.items():
              source = ast.parse(Path('tests/schema_validation/' + name + '.py').read_text())
              methods = [n for n in ast.walk(source) if isinstance(n, ast.FunctionDef) and n.name.startswith('test_')]
              if len(methods) != count or any(n.decorator_list for n in methods):
                  raise SystemExit('Public/binding method inventory or decoration differs: ' + name)
          ctest = str(Path(shutil.which('ctest')).resolve(strict=True))
          data = json.loads(subprocess.check_output([ctest, '--preset', 'schema-transport-debug',
              '-L', '^schema-(native|public)-behavior$', '--show-only=json-v1'], text=True,
              env={'PATH': '/usr/bin:/bin', 'LC_ALL': 'C.UTF-8', 'LANG': 'C.UTF-8'}))
          if len(data['tests']) != 66 or {item['name'] for item in data['tests']} != expected:
              raise SystemExit('Native/public closed66-program inventory differs')
          for item in data['tests']:
              properties = {entry['name']: entry['value'] for entry in item['properties']}
              if properties.get('DISABLED') or properties.get('WILL_FAIL'):
                  raise SystemExit('Acceptance disabled or failure-inverted')
          print('Native12 +57freshrows +normalization1 +binding9 +public74 +loader-cleanup1 registered unconditionally')
          PYTHON
      - name: Execute all reviewed native and public acceptance unconditionally
        run: |
          schema_ctest_path="$(command -v ctest)"
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LANG=C.UTF-8 \
            "$schema_ctest_path" --preset schema-transport-debug -L '^schema-(native|public)-behavior$' --no-tests=error --verbose
      - name: Validate the reference HTTP contract and every declared example
        run: >-
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LANG=C.UTF-8
          "$RUNNER_TEMP/schema-validation-venv/bin/python" -I -B tools/schema_validate.py
          --manifest schemas/http/reference-v1/manifest.json
