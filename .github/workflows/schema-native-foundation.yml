name: Schema native build evidence (no kernel acceptance)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-native-build-evidence:
    name: schema-native-build-evidence (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            python_minor: '3.10'
          - runner: ubuntu-24.04
            python_minor: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record actual native host and toolchain
        run: |
          uname -a
          c++ --version
          cmake --version
          ninja --version
          ldd --version
          /usr/bin/python3 - <<'PYTHON'
          import sys
          expected = tuple(map(int, '${{ matrix.python_minor }}'.split('.')))
          if sys.version_info[:2] != expected:
              raise SystemExit('Runner did not select the admitted Python minor')
          print(sys.version)
          PYTHON
      - name: Configure the reviewed inert ABI and real native facilities
        run: >-
          cmake --preset schema-transport-debug
          -DPython3_EXECUTABLE=/usr/bin/python3
          -DSUBATHON_FETCH_GOOGLETEST=ON
      - name: Build the native foundation and versioned artifact
        run: cmake --build --preset schema-transport-debug --verbose
      - name: Record actual artifact identity and exports
        run: |
          sha256sum build/schema-transport-debug/lib/libsubathon_schema_transport_v1.so
          sha256sum tools/schema_validation/native/transport_v1.h tools/schema_validation/native/transport_stub.cpp
          sha256sum tests/schema_validation/native_foundation.cpp tests/schema_validation/native_foundation_child.cpp tests/schema_validation/native_foundation_child.h tests/schema_validation/native_loader_foundation.py
          nm -D --defined-only build/schema-transport-debug/lib/libsubathon_schema_transport_v1.so
      - name: Run reviewed static-audit controls without any native discovery
        run: >-
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LANG=C.UTF-8
          /usr/bin/python3 -I -S -B tests/schema_validation/native_audit_controls.py
      - name: Audit generated raw child functions before any native execution
        run: >-
          env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 LANG=C.UTF-8
          /usr/bin/python3 -I -S -B tools/schema_validation/audit_native_foundation.py
          --foundation "$PWD/build/schema-transport-debug/tests/schema_validation/schema_transport_native_foundation"
          --child "$PWD/build/schema-transport-debug/tests/schema_validation/schema_transport_native_foundation_child"
          --transport "$PWD/build/schema-transport-debug/lib/libsubathon_schema_transport_v1.so"
      - name: Export actual clone entry and binding relocations for different review
        run: |
          /usr/bin/python3 - <<'PYTHON'
          from pathlib import Path
          import runpy
          import subprocess
          namespace = runpy.run_path('tools/schema_validation/audit_native_foundation.py', run_name='native_static_evidence')
          executable = Path('build/schema-transport-debug/tests/schema_validation/schema_transport_native_foundation').resolve(strict=True)
          functions = namespace['disassembly'](executable)
          probe_name = '(anonymous namespace)::probe(bool, (anonymous namespace)::Controller*)'
          probes = [item for item in functions.values() if item[1] == probe_name]
          if len(probes) != 1:
              raise SystemExit('Actual native probe symbol is missing/ambiguous')
          instructions = probes[0][2]
          calls = [index for index, item in enumerate(instructions) if item[1].startswith('call') and 'syscall@' in item[2]]
          if len(calls) != 1:
              raise SystemExit('Actual clone syscall edge needs separate extraction/review')
          print('ACTUAL CLONE RETURN EDGE; EVIDENCE ONLY, NO RUNTIME ADMISSION', flush=True)
          for address, mnemonic, operands in instructions[max(0, calls[0]-8):calls[0]+30]:
              print(f'{address:x}: {mnemonic} {operands}', flush=True)
          bindings = [item for item in functions.values() if 'SyscallBindingToActualLibc_Test::TestBody()' in item[1]]
          if len(bindings) != 1:
              raise SystemExit('Actual binding test symbol is missing/ambiguous')
          print('ACTUAL ADDRESS-TAKEN BINDING REFERENCES', flush=True)
          for address, mnemonic, operands in bindings[0][2]:
              if 'syscall@' in operands:
                  print(f'{address:x}: {mnemonic} {operands}', flush=True)
          print('ACTUAL SYSCALL PLT', flush=True)
          for _, name, instructions in functions.values():
              if name == 'syscall@plt':
                  print(name, instructions, flush=True)
          print('ACTUAL DYNAMIC SYMBOL RELOCATIONS', flush=True)
          subprocess.run(['readelf', '-Wr', str(executable)], check=True, timeout=30)
          print('Build/static evidence only; no bootstrap, discovery, loader or kernel case executed', flush=True)
          PYTHON
