name: Timer lifecycle acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timer-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure with explicit pinned GoogleTest fetch
        run: cmake --preset timer-lifecycle-debug -DSUBATHON_FETCH_GOOGLETEST=ON
      - name: Build reviewed timer lifecycle cases
        run: cmake --build --preset timer-lifecycle-debug
      - name: Run deterministic timer lifecycle cases
        run: ctest --preset timer-lifecycle-debug -L timer-lifecycle
