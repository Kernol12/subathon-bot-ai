name: Timer editorial acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timer-editorial-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure std-only acceptance with explicit pinned GoogleTest fetch
        run: >-
          cmake --preset timer-editorial-debug -DSUBATHON_FETCH_GOOGLETEST=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
      - name: Build editorial acceptance and existing dependency checks
        run: cmake --build --preset timer-editorial-debug
      - name: Require the exact enabled reviewed cases and dependency inventory
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          import re
          import subprocess

          source = Path("tests/acceptance/timer_editorial_commands_tests.cpp").read_text(encoding="utf-8")
          definitions = re.findall(r"\bTEST\s*\(\s*(\w+)\s*,\s*(\w+)\s*\)", source)
          authored = {suite + "." + name for suite, name in definitions}
          inventory = json.loads(Path("tests/fixtures/timer-editorial-commands-v1.json").read_text(encoding="utf-8"))
          rows = inventory["cases"]
          names = [row["name"] for row in rows]
          if len(definitions) != 27 or len(authored) != 27 or len(names) != 27 or set(names) != authored:
              raise SystemExit("The reviewed 27-method source/JSON inventory changed")
          if any(suite != "TimerEditorial" or name.startswith("DISABLED_") for suite, name in definitions):
              raise SystemExit("An editorial case has an unexpected suite or is disabled")
          if any(set(row) != {"name", "logical_examples", "api_sections"} for row in rows):
              raise SystemExit("The case inventory must remain a name/map document")
          if {example for row in rows for example in row["logical_examples"]} != {f"ED{i:02}" for i in range(1, 45)}:
              raise SystemExit("The case map must preserve all 44 reviewed logical examples")
          if re.search(r"\b(?:GTEST_SKIP|DISABLED_|EXPECT_ANY_THROW|ASSERT_ANY_THROW)\b", source):
              raise SystemExit("The baseline contains a skip, disabled case or generic throw oracle")
          discovery = json.loads(subprocess.check_output(
              ["ctest", "--preset", "timer-editorial-debug", "--show-only=json-v1"]))
          expected = {"timer-editorial." + name for name in names}
          found = [case for case in discovery["tests"] if case["name"].startswith("timer-editorial.")]
          if len(found) != 27 or {case["name"] for case in found} != expected:
              raise SystemExit("CTest differs from the exact reviewed editorial inventory")
          for case in found:
              props = {item["name"]: item["value"] for item in case["properties"]}
              if any(props.get(key, False) for key in ("DISABLED", "WILL_FAIL")):
                  raise SystemExit("An editorial case is disabled or failure-inverted")
              if props.get("SKIP_REGULAR_EXPRESSION", [r"\[  SKIPPED \]"]) != [r"\[  SKIPPED \]"]:
                  raise SystemExit("An editorial case has a custom skip expression")
              if any(key in props for key in ("SKIP_RETURN_CODE", "PASS_REGULAR_EXPRESSION", "FAIL_REGULAR_EXPRESSION")):
                  raise SystemExit("An editorial case has a result-rewriting property")
              if set(props.get("LABELS", [])) != {"timer-editorial", "acceptance", "core"}:
                  raise SystemExit("An editorial case has unexpected acceptance labels")
              if props.get("TIMEOUT") != 30:
                  raise SystemExit("An editorial case has an unexpected timeout")
          green = [case for case in discovery["tests"] if case["name"] not in expected]
          if len(discovery["tests"]) != 101 or len(green) != 74:
              raise SystemExit("Expected exactly 27 editorial cases plus 74 approved dependency checks")
          for case in green:
              props = {item["name"]: item["value"] for item in case["properties"]}
              if any(props.get(key, False) for key in ("DISABLED", "WILL_FAIL")):
                  raise SystemExit("An approved dependency check is disabled or inverted")
              if "intentional-red" in props.get("LABELS", []):
                  raise SystemExit("An approved dependency check was put in the red lane")
          print("Discovered 27 enabled editorial acceptance cases and 74 green dependencies")
          PYTHON
      - name: Run every reviewed editorial acceptance case
        run: |
          ulimit -c 0
          ctest --preset timer-editorial-debug -L '^timer-editorial$' --no-tests=error --verbose
      - name: Run all approved dependency checks
        run: |
          ulimit -c 0
          ctest --preset timer-editorial-debug -LE '^timer-editorial$' --no-tests=error --verbose
