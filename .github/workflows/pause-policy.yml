name: Pause policy acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pause-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure with explicit pinned GoogleTest fetch
        run: cmake --preset pause-policy-debug -DSUBATHON_FETCH_GOOGLETEST=ON
      - name: Build reviewed pause policy cases
        run: cmake --build --preset pause-policy-debug
      - name: Run deterministic pause policy cases
        run: ctest --preset pause-policy-debug -L pause-policy
