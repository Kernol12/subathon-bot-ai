name: Qt SQL SQLite writer acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite-writer-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install archive, Qt runtime and pinned Boost headers
        run: |
          echo "QT_PREFIX=$RUNNER_TEMP/qt-6.12.0" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libarchive-tools libglib2.0-0t64 libzstd1 zlib1g libboost1.83-dev=1.83.0-2.1ubuntu3
          dpkg-query -W libboost1.83-dev
      - name: Verify the compiler's selected Boost header version
        run: |
          python3 - <<'PYTHON'
          import subprocess
          macros = subprocess.check_output(
              ["c++", "-dM", "-E", "-x", "c++", "-include", "boost/version.hpp", "/dev/null"],
              text=True,
          )
          expected = "#define BOOST_VERSION 108300"
          if expected not in macros.splitlines():
              raise SystemExit("Compiler did not select pinned Boost 1.83.0 headers")
          print(expected)
          PYTHON
      - name: Fetch and verify the selected official Qt 6.12.0 archives
        working-directory: ${{ runner.temp }}
        run: |
          base=https://download.qt.io/online/qtsdkrepository/linux_x64/desktop/qt6_6120/qt6_6120/qt.qt6.6120.linux_gcc_64
          curl --fail --location --retry 3 "$base/6.12.0-0-202609280346qtbase-Linux-RHEL_9_6-GCC-Linux-RHEL_9_6-X86_64.7z" --output qtbase.7z
          curl --fail --location --retry 3 "$base/6.12.0-0-202609280346icu-linux-Rhel8.6-x86_64.7z" --output icu.7z
          echo '943023b929d0c08eafe7341700b5ed7601284410b7afd6093f950be291d1d7cd  qtbase.7z' | sha256sum --check --strict
          echo '1fdbcd67b1760f3a3f031c64637a9f19992aed2f35aa615e12a468f8c655d4da  icu.7z' | sha256sum --check --strict
          mkdir -p "$QT_PREFIX/lib"
          bsdtar -xf qtbase.7z -C "$QT_PREFIX"
          bsdtar -xf icu.7z -C "$QT_PREFIX/lib"
          test "$("$QT_PREFIX/bin/qtpaths" --qt-version)" = 6.12.0
          test -f "$QT_PREFIX/plugins/sqldrivers/libqsqlite.so"
      - name: Configure reviewed SQL suites
        run: >-
          cmake --preset sqlite-reference-capture-debug -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          -DBoost_DIR=/usr/lib/x86_64-linux-gnu/cmake/Boost-1.83.0
          -Dboost_headers_DIR=/usr/lib/x86_64-linux-gnu/cmake/boost_headers-1.83.0
      - name: Build reviewed SQL suites
        run: cmake --build --preset sqlite-reference-capture-debug
      - name: Verify both initial-capture marker libraries and the link-only interface harness
        run: |
          test -f build/sqlite-reference-capture-debug/server/libsubathon_reference_capture_values.a
          test -f build/sqlite-reference-capture-debug/server/libsubathon_sqlite_reference_capture.a
          test -x build/sqlite-reference-capture-debug/tests/reference_capture_interface_link
          # The interface executable is deliberately never launched or registered.
      - name: Run the environment probe and list the writer baseline
        run: |
          ctest --preset sqlite-reference-capture-debug -R '^scaffold.qt_event_loop$'
          ctest --preset sqlite-reference-capture-debug -L sqlite-writer --show-only
          ctest --preset sqlite-reference-capture-debug -L sqlite-writer --show-only=json-v1 > "$RUNNER_TEMP/writer-tests.json"
          python3 - <<'PYTHON'
          import collections, json, os, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "writer-tests.json").read_text())["tests"]
          if not tests:
              raise SystemExit("No writer baseline registered")
          groups = collections.defaultdict(list)
          for test in tests:
              groups[test["command"][0]].append(test["command"][1] + "()")
          if len(groups) != 2:
              raise SystemExit("Expected writer acceptance and ownership regression suites")
          for executable, registered in groups.items():
              expected = set(subprocess.check_output([executable, "-functions"], text=True).splitlines())
              if not expected or set(registered) != expected or len(registered) != len(expected):
                  raise SystemExit("CTest registration does not match a compiled Qt suite")
          print(f"Discovered all {len(tests)} compiled writer cases; behavior not run")
          PYTHON
      - name: Run reviewed writer acceptance
        run: ctest --preset sqlite-reference-capture-debug -L sqlite-writer
      - name: Check complete transaction-work registration
        run: |
          ctest --preset sqlite-reference-capture-debug -L sqlite-work --show-only
          ctest --preset sqlite-reference-capture-debug -L sqlite-work --show-only=json-v1 > "$RUNNER_TEMP/work-tests.json"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "work-tests.json").read_text())["tests"]
          if not tests:
              raise SystemExit("No transaction-work baseline registered")
          executables = {test["command"][0] for test in tests}
          if len(executables) != 1:
              raise SystemExit("Expected one transaction-work Qt suite")
          expected = set(subprocess.check_output([next(iter(executables)), "-functions"], text=True).splitlines())
          registered = [test["command"][1] + "()" for test in tests]
          if not expected or set(registered) != expected or len(registered) != len(expected):
              raise SystemExit("CTest registration does not match the compiled work suite")
          print(f"Discovered all {len(tests)} compiled transaction-work cases")
          PYTHON
      - name: Run reviewed transaction-work acceptance
        run: ctest --preset sqlite-reference-capture-debug -L sqlite-work
      - name: Run required selected-Qt migration diagnostic environment probe
        run: |
          python3 - <<'PYTHON'
          import subprocess
          executable = "build/sqlite-reference-capture-debug/tests/qt/server_sqlite_migration_environment"
          expected = {
              "fixedFunctionsUseExistingWriterAndUtf8()",
              "metadataProjectionHasExpectedNullIndexSql()",
              "integrityFunctionRejectsOrdinaryShadow()",
              "foreignKeyFunctionRejectsOrdinaryShadow()",
              "encodingFunctionRejectsOrdinaryShadow()",
              "utf16EncodingAndRawBytesAreObservedWithoutConversion()",
              "integrityAndForeignKeyDiagnosticsAreDistinct()",
          }
          compiled = subprocess.check_output([executable, "-functions"], text=True).splitlines()
          if set(compiled) != expected or len(compiled) != len(expected):
              raise SystemExit("Required diagnostic environment cases do not match compiled slots")
          print("Discovered all 7 required diagnostic environment cases")
          PYTHON
          ctest --preset sqlite-reference-capture-debug -R '^scaffold.sqlite_migration_environment$' --verbose
      - name: Check complete migration catalog registration
        run: |
          ctest --preset sqlite-reference-capture-debug -L sqlite-migrations --show-only
          ctest --preset sqlite-reference-capture-debug -L sqlite-migrations --show-only=json-v1 > "$RUNNER_TEMP/migration-tests.json"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "migration-tests.json").read_text())["tests"]
          if not tests:
              raise SystemExit("No migration catalog baseline registered")
          executables = {test["command"][0] for test in tests}
          if len(executables) != 1:
              raise SystemExit("Expected one migration catalog Qt suite")
          expected = set(subprocess.check_output([next(iter(executables)), "-functions"], text=True).splitlines())
          registered = [test["command"][1] + "()" for test in tests]
          if not expected or set(registered) != expected or len(registered) != len(expected):
              raise SystemExit("CTest registration does not match the compiled migration suite")
          print(f"Discovered all {len(tests)} compiled migration cases")
          PYTHON
      - name: Run reviewed migration catalog acceptance
        run: ctest --preset sqlite-reference-capture-debug -L sqlite-migrations
      - name: Check and run required retained-context fixture diagnostics
        run: |
          python3 - <<'PYTHON'
          import subprocess
          executable = "build/sqlite-reference-capture-debug/tests/qt/server_sqlite_retained_context_environment"
          expected = {
              "emptyNullAndOpaqueBindingsRemainDistinct()",
              "retentionMigrationShapeAndLinksUseExistingSql()",
              "selectedEmptyAndOptionalValuesKeepTheirSqlTypes()",
          }
          compiled = subprocess.check_output([executable, "-functions"], text=True).splitlines()
          if set(compiled) != expected or len(compiled) != len(expected):
              raise SystemExit("Required retention fixture cases do not match compiled slots")
          print("Discovered all 3 required retention fixture cases")
          PYTHON
          ctest --preset sqlite-reference-capture-debug -R '^scaffold.sqlite_retained_context_environment$' --verbose
      - name: Check complete retained-context registration
        run: |
          ctest --preset sqlite-reference-capture-debug -L sqlite-retained --show-only
          ctest --preset sqlite-reference-capture-debug -L sqlite-retained --show-only=json-v1 > "$RUNNER_TEMP/retained-tests.json"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "retained-tests.json").read_text())["tests"]
          if not tests:
              raise SystemExit("No retained-context baseline registered")
          executables = {test["command"][0] for test in tests}
          if len(executables) != 1:
              raise SystemExit("Expected one retained-context Qt suite")
          expected = set(subprocess.check_output([next(iter(executables)), "-functions"], text=True).splitlines())
          registered = [test["command"][1] + "()" for test in tests]
          if not expected or set(registered) != expected or len(registered) != len(expected):
              raise SystemExit("CTest registration does not match the compiled retention suite")
          print(f"Discovered all {len(tests)} compiled retained-context cases")
          PYTHON
      - name: Run reviewed retained-context acceptance
        run: ctest --preset sqlite-reference-capture-debug -L sqlite-retained
      - name: Check and run required receipt fixture diagnostics
        run: |
          python3 - <<'PYTHON'
          import subprocess
          executable = "build/sqlite-reference-capture-debug/tests/qt/server_sqlite_receipts_environment"
          expected = {
              "receiptSchemaPrefixMatchesLiteralProjection()",
              "unsignedIdsAndSignedFieldsRemainExact()",
              "optionalGroupsAndTypedReferencesUseLiteralSchema()",
          }
          compiled = subprocess.check_output([executable, "-functions"], text=True).splitlines()
          if set(compiled) != expected or len(compiled) != len(expected):
              raise SystemExit("Required receipt fixture cases do not match compiled slots")
          print("Discovered all 3 required receipt fixture cases")
          PYTHON
          ctest --preset sqlite-reference-capture-debug -R '^scaffold.sqlite_receipts_environment$' --verbose
      - name: Check complete receipt acceptance registration
        run: |
          ctest --preset sqlite-reference-capture-debug -L sqlite-receipt --show-only
          ctest --preset sqlite-reference-capture-debug -L sqlite-receipt --show-only=json-v1 > "$RUNNER_TEMP/receipt-tests.json"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "receipt-tests.json").read_text())["tests"]
          if not tests:
              raise SystemExit("No receipt baseline registered")
          executables = {test["command"][0] for test in tests}
          if len(executables) != 1:
              raise SystemExit("Expected one receipt Qt suite")
          expected = set(subprocess.check_output([next(iter(executables)), "-functions"], text=True).splitlines())
          registered = [test["command"][1] + "()" for test in tests]
          if not expected or set(registered) != expected or len(registered) != len(expected):
              raise SystemExit("CTest registration does not match the compiled receipt suite")
          print(f"Discovered all {len(tests)} compiled receipt acceptance cases")
          PYTHON
      - name: Run reviewed identified-receipt acceptance
        run: ctest --preset sqlite-reference-capture-debug -L sqlite-receipt
      - name: Check and run required contribution fixture diagnostics
        run: |
          python3 - <<'PYTHON'
          import subprocess
          executable = "build/sqlite-reference-capture-debug/tests/qt/server_sqlite_contributions_environment"
          expected = {
              "contributionSchemaPrefixMatchesLiteralProjection()",
              "unsignedContributionIdsAndNullableAssociationsStayDistinct()",
              "groupedConditionsRolesAndProofUseLiteralSchema()",
          }
          compiled = subprocess.check_output([executable, "-functions"], text=True).splitlines()
          if set(compiled) != expected or len(compiled) != len(expected):
              raise SystemExit("Required contribution fixture cases do not match compiled slots")
          print("Discovered all 3 required contribution fixture cases")
          PYTHON
          ctest --preset sqlite-reference-capture-debug -R '^scaffold.sqlite_contributions_environment$' --verbose
      - name: Check complete contribution acceptance registration
        run: |
          ctest --preset sqlite-reference-capture-debug -L sqlite-contribution --show-only
          ctest --preset sqlite-reference-capture-debug -L sqlite-contribution --show-only=json-v1 > "$RUNNER_TEMP/contribution-tests.json"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "contribution-tests.json").read_text())["tests"]
          if not tests:
              raise SystemExit("No contribution acceptance registered")
          executables = {test["command"][0] for test in tests}
          if len(executables) != 1:
              raise SystemExit("Expected one contribution Qt suite")
          expected = set(subprocess.check_output([next(iter(executables)), "-functions"], text=True).splitlines())
          registered = [test["command"][1] + "()" for test in tests]
          if not expected or set(registered) != expected or len(registered) != len(expected):
              raise SystemExit("CTest registration does not match the compiled contribution suite")
          print(f"Discovered all {len(tests)} compiled contribution acceptance cases")
          PYTHON
      - name: Run reviewed contribution acceptance
        run: ctest --preset sqlite-reference-capture-debug -L sqlite-contribution
      - name: Check and run required captured-plan fixture diagnostics
        run: |
          python3 - <<'PYTHON'
          import subprocess
          executable = "build/sqlite-reference-capture-debug/tests/qt/server_sqlite_application_plans_environment"
          expected = {
              "planSchemaPrefixMatchesLiteralProjection()",
              "unsignedRevisionFieldsAndSparseHistoryStayExplicit()",
              "exactValuationAndOrderedPayloadsKeepLiteralTypes()",
              "planConstraintsRefuseInvalidPhysicalValues()",
          }
          compiled = subprocess.check_output([executable, "-functions"], text=True).splitlines()
          if set(compiled) != expected or len(compiled) != len(expected):
              raise SystemExit("Required captured-plan fixture cases do not match compiled slots")
          print("Discovered all 4 required captured-plan fixture cases")
          PYTHON
          ctest --preset sqlite-reference-capture-debug -R '^scaffold.sqlite_application_plans_environment$' --verbose
      - name: Check complete captured-plan acceptance registration
        run: |
          ctest --preset sqlite-reference-capture-debug -L sqlite-plan --show-only
          ctest --preset sqlite-reference-capture-debug -L sqlite-plan --show-only=json-v1 > "$RUNNER_TEMP/plan-tests.json"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "plan-tests.json").read_text())["tests"]
          if not tests:
              raise SystemExit("No captured-plan baseline registered")
          executables = {test["command"][0] for test in tests}
          if len(executables) != 1:
              raise SystemExit("Expected one captured-plan Qt suite")
          expected = set(subprocess.check_output([next(iter(executables)), "-functions"], text=True).splitlines())
          registered = [test["command"][1] + "()" for test in tests]
          if not expected or set(registered) != expected or len(registered) != len(expected):
              raise SystemExit("CTest registration does not match the compiled captured-plan suite")
          print(f"Discovered all {len(tests)} compiled captured-plan cases; behavior not run")
          PYTHON
      - name: Run reviewed captured-plan acceptance
        run: ctest --preset sqlite-reference-capture-debug -L sqlite-plan
      - name: Check and run required application-bundle fixture diagnostics
        run: |
          python3 - <<'PYTHON'
          import subprocess
          executable = "build/sqlite-reference-capture-debug/tests/qt/server_sqlite_application_bundle_environment"
          expected = {
              "bundleSchemaPrefixMatchesLiteralProjection()",
              "typedBundlePayloadsAndHistoricalProvenanceRemainExact()",
              "multipleOriginalBasesShareOneRequestAndHeads()",
              "bundleConstraintsAndRuntimeOnlyAdmissionsAreExplicit()",
              "conditionalMidstageFaultRollsBackPreparedUnit()",
          }
          compiled = subprocess.check_output([executable, "-functions"], text=True).splitlines()
          if set(compiled) != expected or len(compiled) != len(expected):
              raise SystemExit("Required bundle fixture cases do not match compiled slots")
          print("Discovered all 5 required application-bundle fixture cases")
          PYTHON
          ctest --preset sqlite-reference-capture-debug -R '^scaffold.sqlite_application_bundle_environment$' --verbose
      - name: Check complete application-bundle acceptance registration
        run: |
          ctest --preset sqlite-reference-capture-debug -L '^sqlite-bundle$' --show-only
          ctest --preset sqlite-reference-capture-debug -L '^sqlite-bundle$' --show-only=json-v1 > "$RUNNER_TEMP/bundle-tests.json"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "bundle-tests.json").read_text())["tests"]
          if len(tests) != 35:
              raise SystemExit("Expected all 35 reviewed application-bundle cases")
          executables = {test["command"][0] for test in tests}
          if len(executables) != 1:
              raise SystemExit("Expected one application-bundle Qt suite")
          expected = set(subprocess.check_output([next(iter(executables)), "-functions"], text=True).splitlines())
          registered = [test["command"][1] + "()" for test in tests]
          if not expected or set(registered) != expected or len(registered) != len(expected):
              raise SystemExit("CTest registration does not match the compiled application-bundle suite")
          print(f"Discovered all {len(tests)} compiled application-bundle cases")
          PYTHON
      - name: Run reviewed application-bundle acceptance
        run: ctest --preset sqlite-reference-capture-debug -L '^sqlite-bundle$'
      - name: Check and run required original-claim fixture diagnostics
        run: |
          python3 - <<'PYTHON'
          import subprocess
          executable = "build/sqlite-reference-capture-debug/tests/qt/server_sqlite_original_claim_environment"
          expected = {
              "minimalFixtureHasCoherentCatalogAndCompetingClaims()",
              "oldLookupValidatesCompleteMinimalRecordsAndLiteralByteBounds()",
              "oldNonemptyFixtureRetainsTwentyItemFoundation()",
          }
          compiled = subprocess.check_output([executable, "-functions"], text=True).splitlines()
          if set(compiled) != expected or len(compiled) != len(expected):
              raise SystemExit("Required original-claim fixture cases do not match compiled slots")
          print("Discovered all 3 required original-claim fixture cases")
          PYTHON
          ctest --preset sqlite-reference-capture-debug -R '^scaffold.sqlite_original_claim_environment$' --verbose
      - name: Check complete original-claim acceptance registration
        run: |
          ctest --preset sqlite-reference-capture-debug -L '^sqlite-original-claim$' --show-only
          ctest --preset sqlite-reference-capture-debug -L '^sqlite-original-claim$' --show-only=json-v1 > "$RUNNER_TEMP/original-claim-tests.json"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "original-claim-tests.json").read_text())["tests"]
          if len(tests) != 18:
              raise SystemExit("Expected all 18 original-claim acceptance cases")
          executables = {test["command"][0] for test in tests}
          if len(executables) != 1:
              raise SystemExit("Expected one original-claim Qt suite")
          expected = set(subprocess.check_output([next(iter(executables)), "-functions"], text=True).splitlines())
          registered = [test["command"][1] + "()" for test in tests]
          if not expected or set(registered) != expected or len(registered) != len(expected):
              raise SystemExit("CTest registration does not match compiled original-claim cases")
          if any(prop["name"] in {"DISABLED", "WILL_FAIL"} and prop["value"] for test in tests for prop in test.get("properties", [])):
              raise SystemExit("Original-claim acceptance must remain enabled without failure inversion")
          print(f"Discovered all {len(tests)} compiled original-claim cases")
          PYTHON
      - name: Run reviewed original-claim acceptance
        run: ctest --preset sqlite-reference-capture-debug -L '^sqlite-original-claim$'
      - name: Required hold fixture diagnostics (old primitives only)
        run: |
          python3 - <<'PYTHON'
          import subprocess
          executable = "build/sqlite-reference-capture-debug/tests/qt/server_sqlite_application_hold_environment"
          expected = {
              "frozenCatalogAndConstraintFoundationIsIndependent()",
              "pendingSourcesAndContiguousHistoryContainNoAppliedSubset()",
              "processedTimerAndDistinctCorrectionHaveCompleteOldClosure()",
          }
          actual = subprocess.check_output([executable, "-functions"], text=True).splitlines()
          if len(actual) != 3 or set(actual) != expected:
              raise SystemExit("Expected all 3 hold fixture diagnostic cases")
          print("Discovered all 3 required hold fixture cases")
          PYTHON
          ctest --preset sqlite-reference-capture-debug -R '^scaffold.sqlite_application_hold_environment$' --verbose
      - name: Check complete durable hold acceptance registration
        run: |
          ctest --preset sqlite-reference-capture-debug -L '^sqlite-hold$' --show-only
          ctest --preset sqlite-reference-capture-debug -L '^sqlite-hold$' --show-only=json-v1 > "$RUNNER_TEMP/hold-tests.json"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "hold-tests.json").read_text())["tests"]
          if len(tests) != 35:
              raise SystemExit("Expected all 35 durable hold acceptance cases")
          executables = {test["command"][0] for test in tests}
          if len(executables) != 1:
              raise SystemExit("Expected one hold Qt suite")
          compiled = subprocess.check_output([next(iter(executables)), "-functions"], text=True).splitlines()
          registered = [test["command"][1] + "()" for test in tests]
          if len(compiled) != 35 or set(registered) != set(compiled) or len(set(registered)) != 35:
              raise SystemExit("CTest registration does not match compiled hold cases")
          if any(prop["name"] in {"DISABLED", "WILL_FAIL"} and prop["value"] for test in tests for prop in test.get("properties", [])):
              raise SystemExit("Hold acceptance must remain enabled without failure inversion")
          print("Discovered all 35 compiled durable hold acceptance cases")
          PYTHON
      - name: Run reviewed durable hold acceptance
        run: ctest --preset sqlite-reference-capture-debug -L '^sqlite-hold$'
      - name: Required independent service fixture diagnostics (old primitives only)
        run: |
          ctest --preset sqlite-reference-capture-debug -R '^scaffold.application_service_environment$' --show-only=json-v1 > "$RUNNER_TEMP/service-environment.json"
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "service-environment.json").read_text())["tests"]
          if len(tests) != 1:
              raise SystemExit("Expected one required service fixture environment")
          test = tests[0]
          if any(prop["name"] in {"DISABLED", "WILL_FAIL"} and prop["value"] for prop in test.get("properties", [])):
              raise SystemExit("Service fixture environment must stay enabled without failure inversion")
          compiled = re.findall(r'^([A-Za-z][A-Za-z0-9_]*)\(\)$', subprocess.check_output([test["command"][0], "-functions"], text=True), re.M)
          expected = {
              "literalFramesAndOwnedDataRemainIndependent",
              "rawSourceStateAndPlanBranchesHaveCompleteOldClosure",
              "completeHistoricalRecordsRetainLiteralServiceDocumentsAndGlobalClaims",
              "independentHoldsAndResolvedRetryRetainLiteralHistory",
              "scriptedPortsReturnOnlyOwnedSyntheticData",
              "actualOldWriterCompletionDistinguishesCommitRollbackAndTailFailure",
          }
          if len(compiled) != 6 or set(compiled) != expected:
              raise SystemExit("Required six compiled service fixture cases do not match")
          print("Discovered all 6 required independent service fixture cases")
          PY
          ctest --preset sqlite-reference-capture-debug -R '^scaffold.application_service_environment$' --verbose
      - name: Check complete reviewed application-service registration
        run: |
          ctest --preset sqlite-reference-capture-debug -L '^application-service$' --show-only=json-v1 > "$RUNNER_TEMP/application-service-tests.json"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          tests = json.loads((Path(os.environ["RUNNER_TEMP"]) / "application-service-tests.json").read_text())["tests"]
          if len(tests) != 43:
              raise SystemExit("Expected all 43 reviewed application-service cases")
          executables = {test["command"][0] for test in tests}
          if len(executables) != 1:
              raise SystemExit("Expected one compiled application-service Qt suite")
          compiled = subprocess.check_output([next(iter(executables)), "-functions"], text=True).splitlines()
          registered = [test["command"][1] + "()" for test in tests]
          if len(compiled) != 43 or len(set(registered)) != 43 or set(registered) != set(compiled):
              raise SystemExit("CTest registration must equal the complete compiled service baseline")
