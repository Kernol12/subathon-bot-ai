name: Contribution evidence simulation acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contribution-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure with explicit pinned GoogleTest fetch
        run: cmake --preset contribution-evidence-debug -DSUBATHON_FETCH_GOOGLETEST=ON
      - name: Build reviewed contribution evidence cases
        run: cmake --build --preset contribution-evidence-debug
      - name: Run synthetic eligibility and repository-port simulation
        run: ctest --preset contribution-evidence-debug -L contribution-evidence
