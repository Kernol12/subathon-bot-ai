name: Password hashing acceptance
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  password-hashing-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare the exact authenticated libsodium source
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 https://download.libsodium.org/libsodium/releases/libsodium-1.0.22.tar.gz --output libsodium-1.0.22.tar.gz
          echo 'adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349  libsodium-1.0.22.tar.gz' | sha256sum --check --strict
          test "$(wc -c < libsodium-1.0.22.tar.gz)" -eq 2008529
          mkdir sodium-source sodium-build
          tar -xzf libsodium-1.0.22.tar.gz --directory sodium-source
          echo "SUBATHON_SODIUM_ROOT=$RUNNER_TEMP/sodium-prefix" >> "$GITHUB_ENV"
      - name: Build and install the selected static SDK into the disposable prefix
        working-directory: ${{ runner.temp }}/sodium-build
        # Configure has native compiler probes. No vendor test or project feature runs here.
        run: |
          ulimit -c 0
          CC=gcc CFLAGS=-O2 /usr/bin/bash "$RUNNER_TEMP/sodium-source/libsodium-1.0.22/configure" --prefix="$SUBATHON_SODIUM_ROOT" --libdir="$SUBATHON_SODIUM_ROOT/lib" --disable-shared --enable-static
          make -j2
          make -j2 install
      - name: Configure explicit SDK and GoogleTest sources
        run: >-
          cmake --preset password-hashing-debug -DSUBATHON_FETCH_GOOGLETEST=ON
          -DSUBATHON_SODIUM_ROOT="$SUBATHON_SODIUM_ROOT"
      - name: Build reviewed password acceptance and independent selected-SDK foundation
        run: |
          cmake --build --preset password-hashing-debug
          cmake --build --preset password-hashing-debug --target password_hashing_fixture_generator
      - name: Verify mandatory foundation and exact enabled acceptance discovery
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          import re
          import subprocess
          discovery = json.loads(subprocess.check_output(
              ["ctest", "--preset", "password-hashing-debug", "--show-only=json-v1"], text=True))
          foundation = [item for item in discovery["tests"]
                        if item["name"] == "scaffold.password_hashing_environment"]
          if len(foundation) != 1:
              raise SystemExit("The mandatory selected-SDK foundation was not discovered exactly once")
          props = {item["name"]: item["value"] for item in foundation[0]["properties"]}
          if props.get("DISABLED", False) or props.get("WILL_FAIL", False):
              raise SystemExit("The selected-SDK foundation is disabled or failure-inverted")
          labels = set(props.get("LABELS", []))
          if not {"scaffold", "password-hashing-environment"}.issubset(labels) or "intentional-red" in labels:
              raise SystemExit("The foundation lost its mandatory green labels")
          if any("fixture_generator" in item["name"] for item in discovery["tests"]):
              raise SystemExit("Synthetic input generation must not run as a CTest test")
          source = Path("tests/acceptance/password_hashing_tests.cpp").read_text(encoding="utf-8")
          definitions = re.findall(r"\bTEST\s*\(\s*(\w+)\s*,\s*(\w+)\s*\)", source)
          expected = {suite + "." + case for suite, case in definitions}
          if len(definitions) != 37 or len(expected) != 37:
              raise SystemExit("The reviewed 37-method password definition inventory changed")
          found = set()
          for item in discovery["tests"]:
              props = {value["name"]: value["value"] for value in item["properties"]}
              labels = set(props.get("LABELS", []))
              if "password-hashing" not in labels:
                  continue
              if props.get("DISABLED", False) or props.get("WILL_FAIL", False):
                  raise SystemExit("A reviewed password method is disabled or failure-inverted")
              if labels != {"password-hashing", "acceptance", "server"}:
                  raise SystemExit("A reviewed password method has unexpected acceptance labels")
              if props.get("TIMEOUT") != 60:
                  raise SystemExit("A password method timeout changed")
              if props.get("SKIP_REGULAR_EXPRESSION", [r"\[  SKIPPED \]"]) != [r"\[  SKIPPED \]"]:
                  raise SystemExit("A password method has custom skip matching")
              if any(key in props for key in ("SKIP_RETURN_CODE", "PASS_REGULAR_EXPRESSION", "FAIL_REGULAR_EXPRESSION")):
                  raise SystemExit("A password method rewrites results")
              found.add(item["name"])
          if found != expected:
              raise SystemExit("CTest did not discover every reviewed password method")
          print("Discovered37 enabled ordinary password acceptance methods")
          print("Mandatory green selected-SDK foundation discovered; no feature body executed")
          PYTHON
      - name: Require real selected-SDK runtime, vector and guarded-memory foundation
        run: |
          ulimit -c 0
          ctest --preset password-hashing-debug -R '^scaffold.password_hashing_environment$' --no-tests=error --verbose
      - name: Run every reviewed password acceptance method
        run: |
          ulimit -c 0
          ctest --preset password-hashing-debug -L '^password-hashing$' --no-tests=error --verbose
      - name: Run existing infrastructure checks
        run: ctest --preset password-hashing-debug -L '^scaffold$' -E '^scaffold.password_hashing_environment$' --no-tests=error --verbose
